<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Mi biblioteca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cabecera verde oscuro con el título y las acciones, barra pegajosa de búsqueda y filtros, un resumen de estanterías plegable, la lista de libros y una ficha lateral. */
:root {
  --bg: #f4f5f2;
  --paper: #ffffff;
  --paper-2: #e8ebe6;
  --ink: #1c231f;
  --ink-2: #5d665f;
  --line: #d4d9d2;
  --band: #16332b;
  --band-ink: #eef3ee;
  --band-ink-2: #a9bfb3;
  --accent: #1f6f78;
  --accent-ink: #ffffff;
  --accent-soft: #d8ebec;
  --gold: #c8911f;
  --gold-soft: #f7ead0;
  --bad: #a33b3b;
  --bad-soft: #f3dcdc;
  --ok: #3b7a4a;
  --ok-soft: #dcecdf;
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "Public Sans", "Helvetica Neue", Arial, sans-serif;
  --shadow: 0 12px 34px rgba(16, 28, 22, .16);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151917; --paper: #1e2422; --paper-2: #28302c; --ink: #e9ece7; --ink-2: #a3ada6; --line: #39423d;
    --band: #0f1f1a; --band-ink: #eef3ee; --band-ink-2: #8fa89b;
    --accent: #6fc0c8; --accent-ink: #0f1a1c; --accent-soft: #1e373a; --gold: #e0b35b; --gold-soft: #3c3117;
    --bad: #e07c7c; --bad-soft: #3f2323; --ok: #86c694; --ok-soft: #22362a; --shadow: 0 12px 34px rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151917; --paper: #1e2422; --paper-2: #28302c; --ink: #e9ece7; --ink-2: #a3ada6; --line: #39423d;
  --band: #0f1f1a; --band-ink: #eef3ee; --band-ink-2: #8fa89b;
  --accent: #6fc0c8; --accent-ink: #0f1a1c; --accent-soft: #1e373a; --gold: #e0b35b; --gold-soft: #3c3117;
  --bad: #e07c7c; --bad-soft: #3f2323; --ok: #86c694; --ok-soft: #22362a; --shadow: 0 12px 34px rgba(0,0,0,.55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.sr { position: absolute; left: -9999px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Cabecera */
.band { background: var(--band); color: var(--band-ink); }
.band .gutter { padding-block: 18px 16px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.brand h1 { font-family: var(--display); font-weight: 500; font-size: 34px; line-height: 1; margin: 0; letter-spacing: -.01em; }
.brand p { margin: 6px 0 0; color: var(--band-ink-2); font-size: 13px; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 7px 12px; min-width: 92px; cursor: pointer; text-align: left; color: inherit; }
.tile b { display: block; font-family: var(--display); font-size: 22px; font-weight: 500; line-height: 1.05; font-variant-numeric: tabular-nums; }
.tile span { font-size: 11.5px; color: var(--band-ink-2); text-transform: uppercase; letter-spacing: .06em; }
.tile.gold b { color: var(--gold); }
.tile[aria-pressed="true"] { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.4); }
.band-actions { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
.ghost { background: transparent; color: var(--band-ink); border: 1px solid rgba(255,255,255,.28); border-radius: 8px; padding: 6px 11px; font-size: 13px; }
.ghost[aria-pressed="true"] { background: var(--band-ink); color: var(--band); }
.menu { position: relative; }
.menu-list { position: absolute; top: calc(100% + 6px); left: 0; background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); min-width: 240px; padding: 6px; z-index: 15; display: flex; flex-direction: column; }
.menu-list button { background: transparent; border: 0; text-align: left; padding: 8px 10px; border-radius: 6px; }
.menu-list button:hover { background: var(--paper-2); }
.menu-list small { display: block; color: var(--ink-2); font-size: 11.5px; }

/* Barra de filtros */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.bar .gutter { padding-block: 10px 8px; }
.search-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { flex: 1 1 280px; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 2px 0; font-size: 15px; }
.search input:focus { outline: none; }
.search svg { width: 16px; height: 16px; flex: none; color: var(--ink-2); }
.search kbd { font-size: 11px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-family: var(--body); }
select { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; max-width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip .n { font-variant-numeric: tabular-nums; opacity: .8; margin-left: 4px; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 7px 12px; font-weight: 500; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.small { padding: 4px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: default; }

main .gutter { padding-block: 12px 48px; }
.notice { background: var(--gold-soft); color: var(--ink); border-radius: 8px; padding: 8px 12px; margin: 0 0 12px; font-size: 13px; }
.notice.ok { background: var(--ok-soft); }

/* Resumen de estanterías */
.shelves { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin: 0 0 16px; }
.shelf { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.shelf h3 { font-family: var(--display); font-weight: 500; font-size: 18px; margin: 0 0 6px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.shelf h3 small { font-family: var(--body); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.shelf ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.shelf li button { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; background: transparent; border: 0; padding: 4px 6px; border-radius: 6px; text-align: left; font-size: 13px; }
.shelf li button:hover { background: var(--paper-2); }
.shelf li button[aria-pressed="true"] { background: var(--accent-soft); }
.shelf .barw { position: relative; height: 4px; background: var(--paper-2); border-radius: 2px; margin-top: 3px; overflow: hidden; }
.shelf .barw i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 2px; }
.shelf .cnt { font-variant-numeric: tabular-nums; color: var(--ink-2); }

/* Vista de préstamos */
.loans { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.loan { background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 10px; padding: 10px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.loan .t { font-family: var(--display); font-size: 17px; }
.loan .d { color: var(--ink-2); font-size: 13px; }
.loan .act { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 6px; }

/* Lista */
.list-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--ink-2); font-size: 13px; margin: 2px 0 8px; flex-wrap: wrap; }
.rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 9px 8px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: center; }
.row:hover { background: var(--paper); }
.row[aria-current="true"] { background: var(--accent-soft); }
.row .t { font-family: var(--display); font-size: 17px; line-height: 1.25; min-width: 0; }
.row .t em { font-style: normal; background: var(--gold-soft); border-radius: 3px; padding: 0 2px; }
.row .t .tomo { color: var(--ink-2); font-size: 13.5px; font-family: var(--body); }
.row .a { color: var(--ink-2); font-size: 13px; min-width: 0; }
.row .meta { grid-column: 2; grid-row: 1 / span 2; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 12px; color: var(--ink-2); text-align: right; }
.tag { display: inline-block; border-radius: 4px; padding: 1px 6px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.tag.cat { background: var(--paper-2); color: var(--ink-2); }
.tag.loan { background: var(--gold-soft); color: var(--gold); }
.tag.rev { background: var(--bad-soft); color: var(--bad); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.new { background: var(--accent-soft); color: var(--accent); }
.tag.dup { background: var(--paper-2); color: var(--ink-2); border: 1px dashed var(--ink-2); }
.more { display: block; width: 100%; margin-top: 10px; padding: 10px; border: 1px dashed var(--line); background: transparent; border-radius: 8px; color: var(--ink-2); }
.empty { padding: 30px 10px; text-align: center; color: var(--ink-2); }

/* Ficha */
.backdrop { position: fixed; inset: 0; background: rgba(8,14,11,.4); z-index: 20; }
aside.panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--paper); z-index: 21; box-shadow: var(--shadow);
  overflow-y: auto; padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px;
}
.panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.panel h2 { font-family: var(--display); font-weight: 500; font-size: 24px; line-height: 1.2; margin: 0; text-wrap: balance; }
.panel .sub { color: var(--ink-2); margin-top: 4px; }
.close { border: 0; background: var(--paper-2); border-radius: 50%; width: 32px; height: 32px; flex: none; font-size: 18px; line-height: 1; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 5px 10px; font-size: 13px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.card h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); font-weight: 600; }
.card.loaned { border-color: var(--gold); background: var(--gold-soft); }
.field { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--ink-2); }
.field input, .field select, .field textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; color: var(--ink); width: 100%; }
.field textarea { min-height: 54px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.hist { list-style: none; margin: 0; padding: 0; font-size: 12.5px; color: var(--ink-2); display: flex; flex-direction: column; gap: 3px; }
.hint { font-size: 12px; color: var(--ink-2); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 30; max-width: 90vw; }
details.add { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin: 0 0 12px; background: var(--paper); }
details.add summary { cursor: pointer; font-weight: 500; }
details.add .grid2 { margin-top: 8px; }
.dup-list { font-size: 12.5px; color: var(--ink-2); }
@media (max-width: 640px) {
  .kv { grid-template-columns: 1fr; gap: 2px; }
  .kv dt { margin-top: 6px; }
  .grid2 { grid-template-columns: 1fr; }
  .brand h1 { font-size: 28px; }
  .tile { min-width: 0; flex: 1 1 28%; padding: 6px 9px; }
  .tile b { font-size: 19px; }
  .loan .act { grid-column: 1; grid-row: auto; }
}
@media (prefers-reduced-motion: no-preference) {
  aside.panel { animation: slide .18s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
}
</style>

<header class="band">
  <div class="gutter">
    <div class="brand">
      <h1>Mi biblioteca</h1>
      <p id="subtitle">Catálogo leído de los vídeos de las estanterías.</p>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="band-actions">
      <button class="ghost" id="btnShelves" aria-pressed="false">Estanterías</button>
      <button class="ghost" id="btnLoans" aria-pressed="false">Préstamos</button>
      <button class="ghost" id="btnRandom">Al azar</button>
      <div class="menu">
        <button class="ghost" id="btnExport" aria-haspopup="true" aria-expanded="false">Exportar e importar</button>
        <div class="menu-list" id="exportMenu" hidden>
          <button id="exCsv">Descargar CSV de la lista actual<small>Lo que está filtrado ahora, con tus correcciones</small></button>
          <button id="exAll">Descargar CSV del catálogo completo<small>Todos los libros con estantería, balda y estado</small></button>
          <button id="exJson">Copia de seguridad de tus datos<small>Préstamos, correcciones y libros añadidos, en JSON</small></button>
          <button id="imJson">Restaurar una copia de seguridad<small>Lee un JSON exportado desde aquí</small></button>
          <input type="file" id="imFile" accept="application/json" class="sr">
        </div>
      </div>
    </div>
  </div>
</header>

<div class="bar">
  <div class="gutter">
    <div class="search-row">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="sr">Buscar</span>
        <input id="q" type="search" placeholder="Buscar por título, autor, colección o editorial" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <select id="mueble" aria-label="Estantería"><option value="">Todas las estanterías</option></select>
      <select id="balda" aria-label="Balda"><option value="">Todas las baldas</option></select>
      <select id="cat" aria-label="Categoría"><option value="">Todas las categorías</option></select>
      <select id="orden" aria-label="Orden">
        <option value="pos">Orden en la estantería</option>
        <option value="titulo">Por título</option>
        <option value="autor">Por autor</option>
      </select>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Estado"></div>
  </div>
</div>

<main>
  <div class="gutter">
    <div id="notice" class="notice" hidden></div>
    <section id="shelves" class="shelves" hidden></section>
    <section id="loansView" hidden></section>
    <details class="add" id="addBox">
      <summary>Añadir un libro a mano</summary>
      <form id="addForm">
        <div class="grid2">
          <label class="field">Título <input id="n_titulo" required></label>
          <label class="field">Autor <input id="n_autor"></label>
          <label class="field">Colección <input id="n_col"></label>
          <label class="field">Tomo <input id="n_tomo"></label>
          <label class="field">Editorial <input id="n_ed"></label>
          <label class="field">Categoría <select id="n_cat"></select></label>
          <label class="field">Estantería <input id="n_mueble" list="muebles"></label>
          <label class="field">Balda <input id="n_balda"></label>
        </div>
        <datalist id="muebles"></datalist>
        <div class="actions" style="margin-top:8px"><button class="btn primary" type="submit">Guardar libro</button></div>
      </form>
    </details>
    <div class="list-head"><span id="count"></span><span id="shown"></span></div>
    <ul class="rows" id="rows"></ul>
    <button class="more" id="more" hidden>Mostrar más</button>
  </div>
</main>

<div id="panelHost"></div>

  const F = { id: 0, titulo: 1, autor: 2, col: 3, tomo: 4, ed: 5, cat: 6, conf: 7, mueble: 8, balda: 9, video: 10, seg: 11, notas: 12 };
  const RAW = JSON.parse(document.getElementById('data').textContent);
  const $ = (s) => document.querySelector(s);
  const CATS = ['Literatura', 'Cómic', 'Manga', 'Infantil y juvenil', 'Ensayo y divulgación', 'Ciencia y técnica', 'Fotografía', 'Cocina', 'Varios', 'Ilegible'];
  const FILTERS = [['todos', 'Todos'], ['prestados', 'Prestados'], ['revisar', 'Por revisar'], ['ilegibles', 'Ilegibles'], ['repetidos', 'Posibles repetidos'], ['corregidos', 'Corregidos'], ['anadidos', 'Añadidos a mano']];

  // ---------- Estado ----------
  const base = RAW.map((r, i) => ({
    id: r[F.id], titulo: r[F.titulo], autor: r[F.autor] || '', col: r[F.col] || '', tomo: r[F.tomo] || '', ed: r[F.ed] || '',
    cat: r[F.cat], conf: r[F.conf], mueble: r[F.mueble], balda: r[F.balda], video: r[F.video], seg: r[F.seg], notas: r[F.notas] || '', pos: i, manual: false
  }));
  let extras = [], fixes = {}, loans = [];
  let filter = 'todos', shownLimit = 200, currentId = null, view = 'list';

  function norm(s) { return (s || '').toString().normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function effective(b) {
    const f = fixes[b.id];
    if (!f) return b;
    return Object.assign({}, b, f.campos || {}, { revisado: !!f.revisado, corregido: !!(f.campos && Object.keys(f.campos).length), notaUsuario: f.nota || '' });
  }
  let cacheBooks = null;
  function allBooks() { if (!cacheBooks) cacheBooks = base.concat(extras).map(effective); return cacheBooks; }
  function invalidate() { cacheBooks = null; dupKeys = null; }
  function activeLoan(id) { return loans.find(l => l.libro === id && !l.devuelto); }
  function needsReview(b) { return !b.revisado && (b.conf === 'baja' || b.cat === 'Ilegible'); }
  let dupKeys = null;
  function dupKey(b) { return b.cat === 'Ilegible' ? null : norm(b.titulo).replace(/\s*\(.*?\)\s*/g, ' ').trim() + '|' + norm(b.autor).split(/[ ,]/)[0] + '|' + norm(b.tomo); }
  function isDup(b) {
    if (!dupKeys) { dupKeys = {}; allBooks().forEach(x => { const k = dupKey(x); if (k) dupKeys[k] = (dupKeys[k] || 0) + 1; }); }
    const k = dupKey(b); return k && dupKeys[k] > 1;
  }
  function esc(s) { return (s == null ? '' : s).toString().replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
  function hl(text, q) {
    text = (text || '').toString();
    if (!q) return esc(text);
    const n = norm(text); let out = '', i = 0;
    for (const w of q.split(/\s+/).filter(Boolean)) { const j = n.indexOf(w, i); if (j < 0) continue; out += esc(text.slice(i, j)) + '<em>' + esc(text.slice(j, j + w.length)) + '</em>'; i = j + w.length; }
    return out + esc(text.slice(i));
  }
  function shelfName(m) { const n = m.replace('Estantería de ', ''); return n.charAt(0).toUpperCase() + n.slice(1); }
  function baldaKey(s) { const m = /^(\d+)/.exec(s); return m ? parseInt(m[1], 10) : 99; }
  function today() { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
  function fmtDate(s) { if (!s) return '?'; const [y, m, d] = s.slice(0, 10).split('-'); return d && m ? `${d}/${m}/${y}` : s; }
  function daysSince(s) { if (!s) return 0; return Math.max(0, Math.floor((Date.now() - new Date(s + "T00:00:00").getTime()) / 86400000)); }
  let toastT;
  function toast(msg) { $('#toastHost').innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastT); toastT = setTimeout(() => $('#toastHost').innerHTML = '', 2800); }

  // ---------- Almacenamiento: base de datos de claude.ai si existe, si no el navegador ----------
  const store = { mode: 'none', canWrite: false, ready: false, db: null, downloads: null };
  const LS_KEY = 'biblioteca.datos.v1';
  function lsLoad() { try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch (e) { return {}; } }
  function lsSave(d) { try { localStorage.setItem(LS_KEY, JSON.stringify(d)); return true; } catch (e) { return false; } }
  function uid() { return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/-/g, '').slice(0, 20); }
  function fromLocal() {
    const d = lsLoad();
    loans = Object.entries(d.prestamos || {}).map(([k, v]) => Object.assign({ _id: k }, v));
    fixes = Object.assign({}, d.correcciones || {});
    extras = Object.entries(d.extras || {}).map(([k, v], i) => Object.assign({ id: k, manual: true, conf: 'alta', video: '', seg: null, pos: 100000 + i }, v, { notas: v.nota || '' }));
    invalidate(); fillSelects(); renderAll();
  }
  function localWrite(fn) { const d = lsLoad(); d.prestamos = d.prestamos || {}; d.correcciones = d.correcciones || {}; d.extras = d.extras || {}; fn(d); if (!lsSave(d)) throw new Error('localStorage'); fromLocal(); }
  const api = {
    async addLoan(data) { if (store.mode === 'db') return (await store.db.collection('prestamos').add(data)).id; localWrite(d => { d.prestamos[uid()] = data; }); },
    async updateLoan(id, patch) { if (store.mode === 'db') return store.db.doc('prestamos/' + id).update(patch); localWrite(d => { Object.assign(d.prestamos[id], patch); }); },
    async setFix(id, doc) { if (store.mode === 'db') return store.db.doc('correcciones/' + id).set(doc); localWrite(d => { d.correcciones[id] = doc; }); },
    async delFix(id) { if (store.mode === 'db') return store.db.doc('correcciones/' + id).delete(); localWrite(d => { delete d.correcciones[id]; }); },
    async addExtra(data) { if (store.mode === 'db') return store.db.collection('extras').add(data); localWrite(d => { d.extras[uid()] = data; }); },
    async updateExtra(id, patch) { if (store.mode === 'db') return store.db.doc('extras/' + id).update(patch); localWrite(d => { Object.assign(d.extras[id], patch); }); },
    async delExtra(id) { if (store.mode === 'db') return store.db.doc('extras/' + id).delete(); localWrite(d => { delete d.extras[id]; }); },
  };
  function fail(e) { console.error(e); toast(e && e.code === 'quota_exceeded' ? 'No queda espacio en el almacén de datos.' : 'No se pudo guardar. Inténtalo de nuevo.'); }

  // ---------- Selectores y chips ----------
  function fillSelects() {
    const books = allBooks();
    const muebles = [...new Set(books.map(b => b.mueble))].sort();
    const mSel = $('#mueble'); const keep = mSel.value;
    mSel.innerHTML = '<option value="">Todas las estanterías</option>' + muebles.map(m => `<option>${esc(m)}</option>`).join('');
    mSel.value = muebles.includes(keep) ? keep : '';
    $('#muebles').innerHTML = muebles.map(m => `<option value="${esc(m)}">`).join('');
    const cSel = $('#cat'); const keepC = cSel.value;
    cSel.innerHTML = '<option value="">Todas las categorías</option>' + CATS.map(c => `<option>${c}</option>`).join('');
    cSel.value = keepC;
    if (!$('#n_cat').options.length) $('#n_cat').innerHTML = CATS.filter(c => c !== 'Ilegible').map(c => `<option>${c}</option>`).join('');
    fillBaldas();
  }
  function fillBaldas() {
    const m = $('#mueble').value;
    const bSel = $('#balda'); const keep = bSel.value;
    const baldas = [...new Set(allBooks().filter(b => !m || b.mueble === m).map(b => b.balda))].sort((a, b) => baldaKey(a) - baldaKey(b) || a.localeCompare(b));
    bSel.innerHTML = '<option value="">Todas las baldas</option>' + baldas.map(b => `<option>${esc(b)}</option>`).join('');
    bSel.value = baldas.includes(keep) ? keep : '';
  }
  function renderChips() {
    const books = allBooks();
    const counts = {
      todos: books.length, prestados: loans.filter(l => !l.devuelto).length, revisar: books.filter(needsReview).length,
      ilegibles: books.filter(b => b.cat === 'Ilegible').length, repetidos: books.filter(isDup).length,
      corregidos: books.filter(b => b.corregido || b.revisado).length, anadidos: extras.length
    };
    $('#chips').innerHTML = FILTERS.map(([k, label]) => `<button class="chip" data-f="${k}" aria-pressed="${filter === k}">${label}<span class="n">${counts[k]}</span></button>`).join('');
  }

  // ---------- Filtro y lista ----------
  function filtered() {
    const q = norm($('#q').value.trim());
    const words = q.split(/\s+/).filter(Boolean);
    const m = $('#mueble').value, bd = $('#balda').value, c = $('#cat').value;
    let out = allBooks().filter(b => {
      if (m && b.mueble !== m) return false;
      if (bd && b.balda !== bd) return false;
      if (c && b.cat !== c) return false;
      if (filter === 'prestados' && !activeLoan(b.id)) return false;
      if (filter === 'revisar' && !needsReview(b)) return false;
      if (filter === 'ilegibles' && b.cat !== 'Ilegible') return false;
      if (filter === 'repetidos' && !isDup(b)) return false;
      if (filter === 'corregidos' && !b.corregido && !b.revisado) return false;
      if (filter === 'anadidos' && !b.manual) return false;
      if (words.length) {
        const hay = norm([b.titulo, b.autor, b.col, b.ed, b.tomo, b.notaUsuario].join(' '));
        if (!words.every(w => hay.includes(w))) return false;
      }
      return true;
    });
    const o = $('#orden').value;
    if (o === 'titulo' || filter === 'repetidos') out.sort((a, b) => norm(a.titulo).localeCompare(norm(b.titulo)) || norm(a.autor).localeCompare(norm(b.autor)));
    else if (o === 'autor') out.sort((a, b) => (norm(a.autor) || 'zzz').localeCompare(norm(b.autor) || 'zzz') || norm(a.titulo).localeCompare(norm(b.titulo)));
    return out;
  }
  function rowHtml(b, q) {
    const loan = activeLoan(b.id);
    const tags = [];
    if (loan) tags.push(`<span class="tag loan">Prestado a ${esc(loan.a || 'alguien')}</span>`);
    if (b.manual) tags.push('<span class="tag new">Añadido</span>');
    if (b.revisado) tags.push('<span class="tag ok">Revisado</span>');
    else if (needsReview(b)) tags.push(`<span class="tag rev">${b.cat === 'Ilegible' ? 'Ilegible' : 'Dudoso'}</span>`);
    if (filter === 'repetidos' || (isDup(b) && !loan)) tags.push('<span class="tag dup">Repetido</span>');
    const place = shelfName(b.mueble) + ' · balda ' + (b.balda.split(' ')[0]);
    return `<li class="row" data-id="${esc(b.id)}" aria-current="${b.id === currentId}">
      <div class="t">${hl(b.titulo, q)}${b.tomo ? ' <span class="tomo">' + esc(String(b.tomo)) + '</span>' : ''}</div>
      <div class="a">${hl(b.autor, q)}${b.col ? (b.autor ? ' · ' : '') + hl(b.col, q) : ''}</div>
      <div class="meta"><span class="tag cat">${esc(b.cat)}</span><span>${esc(place)}</span>${tags.join('')}</div>
    </li>`;
  }
  function renderList() {
    const q = norm($('#q').value.trim());
    const items = filtered();
    const slice = items.slice(0, shownLimit);
    $('#rows').innerHTML = slice.length ? slice.map(b => rowHtml(b, q)).join('') : '<li class="empty">Ningún libro coincide con la búsqueda.</li>';
    const total = allBooks().length;
    $('#count').textContent = items.length === total ? `${items.length} libros` : `${items.length} de ${total} libros`;
    $('#shown').textContent = items.length > slice.length ? `Se muestran ${slice.length}` : '';
    $('#more').hidden = items.length <= slice.length;
  }
  function renderTiles() {
    const books = allBooks();
    const prest = loans.filter(l => !l.devuelto).length, rev = books.filter(needsReview).length;
    $('#tiles').innerHTML = `
      <button class="tile" data-go="todos" aria-pressed="${filter === 'todos'}"><b>${books.length}</b><span>libros</span></button>
      <button class="tile gold" data-go="prestados" aria-pressed="${filter === 'prestados'}"><b>${prest}</b><span>prestados</span></button>
      <button class="tile" data-go="revisar" aria-pressed="${filter === 'revisar'}"><b>${rev}</b><span>por revisar</span></button>`;
    $('#subtitle').textContent = `${[...new Set(books.map(b => b.mueble))].length} estanterías · ${[...new Set(books.map(b => b.mueble + '|' + b.balda))].length} baldas · ${books.filter(b => b.cat === 'Cómic' || b.cat === 'Manga').length} cómics y ${books.filter(b => b.cat === 'Literatura').length} libros de literatura`;
  }
  function renderShelves() {
    const sec = $('#shelves'); sec.hidden = view !== 'shelves'; if (sec.hidden) return;
    const books = allBooks(); const curM = $('#mueble').value, curB = $('#balda').value;
    const byM = {};
    books.forEach(b => { (byM[b.mueble] = byM[b.mueble] || {})[b.balda] = (byM[b.mueble][b.balda] || 0) + 1; });
    const maxN = Math.max(...books.map(() => 0), ...Object.values(byM).flatMap(o => Object.values(o)));
    sec.innerHTML = Object.keys(byM).sort().map(m => {
      const baldas = Object.entries(byM[m]).sort((a, b) => baldaKey(a[0]) - baldaKey(b[0]) || a[0].localeCompare(b[0]));
      const tot = baldas.reduce((s, x) => s + x[1], 0);
      return `<div class="shelf"><h3><span>${esc(shelfName(m))}</span><small>${tot} libros</small></h3><ul>${baldas.map(([b, n]) => `
        <li><button data-m="${esc(m)}" data-b="${esc(b)}" aria-pressed="${curM === m && curB === b}"><span>Balda ${esc(b)}<div class="barw"><i style="width:${Math.round(100 * n / maxN)}%"></i></div></span><span class="cnt">${n}</span></button></li>`).join('')}</ul></div>`;
    }).join('');
  }
  function renderLoans() {
    const sec = $('#loansView'); sec.hidden = view !== 'loans'; if (sec.hidden) return;
    const act = loans.filter(l => !l.devuelto).sort((a, b) => (a.desde || '').localeCompare(b.desde || ''));
    const books = allBooks();
    sec.innerHTML = act.length ? `<div class="loans">${act.map(l => {
      const b = books.find(x => x.id === l.libro); const d = daysSince(l.desde);
      return `<div class="loan"><div class="t">${esc(b ? b.titulo : l.titulo)}${b && b.tomo ? ' <span class="tomo" style="font-size:13px;color:var(--ink-2)">' + esc(String(b.tomo)) + '</span>' : ''}</div>
        <div class="d">${esc((b ? b.autor : l.autor) || '')}${(b ? b.autor : l.autor) ? ' · ' : ''}prestado a <b>${esc(l.a || 'alguien')}</b> el ${fmtDate(l.desde)} (${d === 0 ? 'hoy' : d === 1 ? 'hace 1 día' : 'hace ' + d + ' días'})${l.nota ? ' · ' + esc(l.nota) : ''}</div>
        <div class="act"><button class="btn small" data-open="${esc(l.libro)}">Ficha</button><button class="btn small primary" data-return="${esc(l._id)}" ${store.canWrite ? '' : 'disabled'}>Devuelto</button></div></div>`;
    }).join('')}</div>` : '<p class="empty">No tienes ningún libro prestado ahora mismo. Los préstamos se apuntan desde la ficha de cada libro.</p>';
  }
  function renderAll() { renderTiles(); renderChips(); renderShelves(); renderLoans(); renderList(); if (currentId) openPanel(currentId, true); }

  // ---------- Ficha ----------
  function openPanel(id, keep) {
    const b = allBooks().find(x => x.id === id);
    if (!b) return closePanel();
    currentId = id;
    const loan = activeLoan(id);
    const hist = loans.filter(l => l.libro === id && l.devuelto).sort((a, b) => (b.desde || '').localeCompare(a.desde || ''));
    const seg = b.seg != null && b.seg !== '' ? `${b.video}, segundo ${Math.round(b.seg)}` : (b.video || 'añadido a mano');
    const dis = store.canWrite ? '' : 'disabled';
    const dups = isDup(b) ? allBooks().filter(x => x.id !== b.id && dupKey(x) === dupKey(b)) : [];
    $('#panelHost').innerHTML = `
      <div class="backdrop" id="backdrop"></div>
      <aside class="panel" role="dialog" aria-labelledby="pt">
        <div class="panel-head">
          <div><h2 id="pt">${esc(b.titulo)}${b.tomo ? ' <span style="font-weight:400;color:var(--ink-2);font-size:18px">' + esc(String(b.tomo)) + '</span>' : ''}</h2>
            <div class="sub">${esc(b.autor || 'Autor no leído')}</div></div>
          <button class="close" id="closeBtn" aria-label="Cerrar">×</button>
        </div>
        <dl class="kv">
          <dt>Colección</dt><dd>${esc(b.col || '')}</dd>
          <dt>Editorial</dt><dd>${esc(b.ed || '')}</dd>
          <dt>Categoría</dt><dd>${esc(b.cat)}</dd>
          <dt>Dónde está</dt><dd>${esc(b.mueble)}, balda ${esc(b.balda)}</dd>
          <dt>Lectura</dt><dd>Confianza ${esc(b.conf || 'alta')} (${esc(seg)})${b.revisado ? ' · revisado a mano' : ''}</dd>
          ${b.notas ? `<dt>Notas</dt><dd>${esc(b.notas)}</dd>` : ''}
          ${dups.length ? `<dt>Repetido</dt><dd class="dup-list">Parece el mismo libro que ${dups.map(d => esc(shelfName(d.mueble)) + ', balda ' + esc(d.balda.split(' ')[0])).join('; ')}. Pueden ser ediciones distintas.</dd>` : ''}
        </dl>
        <section class="card ${loan ? 'loaned' : ''}">
          <h3>Préstamo</h3>
          ${loan ? `
            <div>Prestado a <b>${esc(loan.a || 'alguien')}</b> desde el ${fmtDate(loan.desde)} (hace ${daysSince(loan.desde)} días)${loan.nota ? ' · ' + esc(loan.nota) : ''}</div>
            <div class="actions"><button class="btn primary" id="returnBtn" ${dis}>Marcar como devuelto</button></div>
          ` : `
            <div class="grid2">
              <label class="field">A quién <input id="loanTo" placeholder="Nombre" list="people" ${dis}></label>
              <label class="field">Desde <input id="loanDate" type="date" value="${today()}" ${dis}></label>
            </div>
            <datalist id="people">${[...new Set(loans.map(l => l.a).filter(Boolean))].map(p => `<option value="${esc(p)}">`).join('')}</datalist>
            <label class="field">Nota <input id="loanNote" placeholder="Opcional" ${dis}></label>
            <div class="actions"><button class="btn primary" id="loanBtn" ${dis}>Apuntar préstamo</button></div>
          `}
          ${hist.length ? `<ul class="hist">${hist.map(h => `<li>Prestado a ${esc(h.a || 'alguien')}, del ${fmtDate(h.desde)} al ${fmtDate(h.devueltoEl)}</li>`).join('')}</ul>` : ''}
        </section>
        <section class="card">
          <h3>Corregir la ficha</h3>
          <div class="grid2">
            <label class="field">Título <input id="f_titulo" value="${esc(b.titulo)}" ${dis}></label>
            <label class="field">Autor <input id="f_autor" value="${esc(b.autor)}" ${dis}></label>
            <label class="field">Colección <input id="f_col" value="${esc(b.col)}" ${dis}></label>
            <label class="field">Tomo <input id="f_tomo" value="${esc(String(b.tomo))}" ${dis}></label>
            <label class="field">Editorial <input id="f_ed" value="${esc(b.ed)}" ${dis}></label>
            <label class="field">Categoría <select id="f_cat" ${dis}>${CATS.map(c => `<option ${c === b.cat ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
          </div>
          <label class="field">Nota tuya <textarea id="f_nota" ${dis}>${esc(b.manual ? b.notas : (fixes[b.id] || {}).nota || '')}</textarea></label>
          <div class="actions">
            <button class="btn primary" id="saveFix" ${dis}>Guardar cambios</button>
            <button class="btn" id="revBtn" ${dis}>${b.revisado ? 'Quitar la marca de revisado' : 'Marcar como revisado'}</button>
            ${b.manual ? `<button class="btn danger" id="delBtn" ${dis}>Eliminar este libro</button>` : ''}
          </div>
          <div class="hint">${storeHint()}</div>
        </section>
      </aside>`;
    $('#backdrop').onclick = closePanel;
    $('#closeBtn').onclick = closePanel;
    if (!keep) $('#closeBtn').focus();
    const g = (s) => document.getElementById(s);
    if (g('loanBtn')) g('loanBtn').onclick = () => doLoan(b);
    if (g('returnBtn')) g('returnBtn').onclick = () => doReturn(loan);
    g('saveFix').onclick = () => saveFix(b);
    g('revBtn').onclick = () => toggleReview(b);
    if (g('delBtn')) g('delBtn').onclick = () => delManual(b);
    document.querySelectorAll('.row').forEach(r => r.setAttribute('aria-current', r.dataset.id === id));
  }
  function storeHint() {
    if (!store.ready) return 'Conectando con el almacén de datos…';
    if (store.mode === 'db') return store.canWrite ? 'Los cambios se guardan en esta página y se ven desde cualquier dispositivo.' : 'Solo lectura: no tienes permiso para guardar cambios.';
    if (store.mode === 'local') return 'Los cambios se guardan en este navegador. Haz una copia de seguridad desde “Exportar e importar” para no perderlos.';
    return 'No hay dónde guardar: este navegador no permite almacenar datos.';
  }
  function closePanel() { currentId = null; $('#panelHost').innerHTML = ''; document.querySelectorAll('.row[aria-current="true"]').forEach(r => r.setAttribute('aria-current', 'false')); }

  // ---------- Escrituras ----------
  async function doLoan(b) {
    const a = $('#loanTo').value.trim(); if (!a) { $('#loanTo').focus(); return toast('Escribe a quién se lo prestas.'); }
    try { await api.addLoan({ libro: b.id, titulo: b.titulo, autor: b.autor, a, desde: $('#loanDate').value || today(), nota: $('#loanNote').value.trim(), devuelto: false, creado: new Date().toISOString() }); toast(`Apuntado: prestado a ${a}.`); } catch (e) { fail(e); }
  }
  async function doReturn(loan) { try { await api.updateLoan(loan._id, { devuelto: true, devueltoEl: today() }); toast('Marcado como devuelto.'); } catch (e) { fail(e); } }
  function baseValue(id, k) { const o = base.find(x => x.id === id); return o ? o[k] : ''; }
  async function saveFix(b) {
    const v = (el) => document.getElementById(el).value.trim();
    const nota = v('f_nota');
    if (b.manual) { try { await api.updateExtra(b.id, { titulo: v('f_titulo'), autor: v('f_autor'), col: v('f_col'), tomo: v('f_tomo'), ed: v('f_ed'), cat: $('#f_cat').value, nota }); toast('Guardado.'); } catch (e) { fail(e); } return; }
    const campos = {};
    [['titulo', 'f_titulo'], ['autor', 'f_autor'], ['col', 'f_col'], ['tomo', 'f_tomo'], ['ed', 'f_ed'], ['cat', 'f_cat']].forEach(([k, el]) => { const val = v(el); if (val !== (baseValue(b.id, k) || '').toString()) campos[k] = val; });
    const prev = fixes[b.id] || {};
    try {
      if (!Object.keys(campos).length && !nota && !prev.revisado) { if (prev.actualizado) await api.delFix(b.id); toast('Sin cambios respecto al catálogo.'); return; }
      await api.setFix(b.id, { campos, nota, revisado: !!prev.revisado, actualizado: new Date().toISOString() }); toast('Corrección guardada.');
    } catch (e) { fail(e); }
  }
  async function toggleReview(b) {
    const prev = fixes[b.id] || { campos: {}, nota: '' };
    try { await api.setFix(b.id, Object.assign({}, prev, { revisado: !b.revisado, actualizado: new Date().toISOString() })); toast(b.revisado ? 'Marca quitada.' : 'Marcado como revisado.'); } catch (e) { fail(e); }
  }
  async function delManual(b) { try { await api.delExtra(b.id); closePanel(); toast('Libro eliminado.'); } catch (e) { fail(e); } }
  $('#addForm').onsubmit = async (ev) => {
    ev.preventDefault();
    if (!store.canWrite) return toast('No hay dónde guardar en esta copia de la página.');
    const v = (s) => $(s).value.trim();
    try { await api.addExtra({ titulo: v('#n_titulo'), autor: v('#n_autor'), col: v('#n_col'), tomo: v('#n_tomo'), ed: v('#n_ed'), cat: $('#n_cat').value, mueble: v('#n_mueble') || 'Sin estantería', balda: v('#n_balda') || 'sin balda', nota: '', creado: new Date().toISOString() }); $('#addForm').reset(); $('#addBox').open = false; toast('Libro añadido.'); } catch (e) { fail(e); }
  };

  // ---------- Exportar e importar ----------
  function csvOf(books) {
    const cols = ['id', 'titulo', 'autor', 'coleccion', 'tomo', 'editorial', 'categoria', 'confianza', 'estanteria', 'balda', 'prestado_a', 'prestado_desde', 'revisado', 'nota', 'video', 'segundo', 'notas_lectura'];
    const cell = (s) => { s = (s == null ? '' : s).toString(); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const lines = [cols.join(',')];
    books.forEach(b => { const l = activeLoan(b.id); lines.push([b.id, b.titulo, b.autor, b.col, b.tomo, b.ed, b.cat, b.conf, b.mueble, b.balda, l ? l.a : '', l ? l.desde : '', b.revisado ? 'sí' : '', b.notaUsuario || (b.manual ? b.notas : ''), b.video, b.seg == null ? '' : b.seg, b.manual ? '' : b.notas].map(cell).join(',')); });
    return '﻿' + lines.join('\r\n');
  }
  async function download(filename, text, type) {
    const blob = new Blob([text], { type });
    if (store.downloads) { try { await store.downloads.save({ filename, data: blob }); return; } catch (e) { if (e && e.code === 'cancelled') return; console.error(e); } }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function backupJson() {
    return JSON.stringify({ formato: 'biblioteca-backup-1', fecha: new Date().toISOString(), prestamos: loans.map(l => { const { _id, ...r } = l; return Object.assign({ id: _id }, r); }), correcciones: fixes, extras: extras.map(x => ({ id: x.id, titulo: x.titulo, autor: x.autor, col: x.col, tomo: x.tomo, ed: x.ed, cat: x.cat, mueble: x.mueble, balda: x.balda, nota: x.notas, creado: x.creado })) }, null, 1);
  }
  async function importJson(file) {
    let d; try { d = JSON.parse(await file.text()); } catch (e) { return toast('Ese archivo no es una copia de seguridad válida.'); }
    if (!d || d.formato !== 'biblioteca-backup-1') return toast('Ese archivo no es una copia de seguridad válida.');
    if (!store.canWrite) return toast('No hay dónde guardar en esta copia de la página.');
    let n = 0;
    try {
      if (store.mode === 'db') {
        for (const l of d.prestamos || []) { const { id, ...r } = l; await store.db.doc('prestamos/' + (id || uid())).set(r); n++; }
        for (const [id, f] of Object.entries(d.correcciones || {})) { await store.db.doc('correcciones/' + id).set(f); n++; }
        for (const x of d.extras || []) { const { id, ...r } = x; await store.db.doc('extras/' + (id || uid())).set(r); n++; }
      } else {
        localWrite(s => {
          (d.prestamos || []).forEach(l => { const { id, ...r } = l; s.prestamos[id || uid()] = r; n++; });
          Object.entries(d.correcciones || {}).forEach(([id, f]) => { s.correcciones[id] = f; n++; });
          (d.extras || []).forEach(x => { const { id, ...r } = x; s.extras[id || uid()] = r; n++; });
        });
      }
      toast(`Restaurados ${n} registros.`);
    } catch (e) { fail(e); }
  }
  $('#btnExport').onclick = (e) => { e.stopPropagation(); const m = $('#exportMenu'); m.hidden = !m.hidden; $('#btnExport').setAttribute('aria-expanded', !m.hidden); };
  document.addEventListener('click', (e) => { if (!e.target.closest('.menu')) { $('#exportMenu').hidden = true; $('#btnExport').setAttribute('aria-expanded', 'false'); } });
  $('#exCsv').onclick = () => download('biblioteca_filtrada.csv', csvOf(filtered()), 'text/csv;charset=utf-8');
  $('#exAll').onclick = () => download('biblioteca_completa.csv', csvOf(allBooks()), 'text/csv;charset=utf-8');
  $('#exJson').onclick = () => download('biblioteca_copia_' + today() + '.json', backupJson(), 'application/json');
  $('#imJson').onclick = () => $('#imFile').click();
  $('#imFile').onchange = () => { if ($('#imFile').files[0]) importJson($('#imFile').files[0]); $('#imFile').value = ''; };

  // ---------- Eventos ----------
  ['#q', '#cat', '#orden', '#balda'].forEach(s => $(s).addEventListener('input', () => { shownLimit = 200; renderList(); renderShelves(); }));
  $('#mueble').addEventListener('input', () => { fillBaldas(); shownLimit = 200; renderList(); renderShelves(); });
  $('#chips').addEventListener('click', (e) => { const btn = e.target.closest('.chip'); if (!btn) return; setFilter(btn.dataset.f); });
  $('#tiles').addEventListener('click', (e) => { const t = e.target.closest('.tile'); if (!t) return; setFilter(t.dataset.go); if (t.dataset.go === 'prestados') setView('loans'); });
  function setFilter(f) { filter = f; shownLimit = 200; renderTiles(); renderChips(); renderList(); }
  function setView(v) { view = view === v ? 'list' : v; $('#btnShelves').setAttribute('aria-pressed', view === 'shelves'); $('#btnLoans').setAttribute('aria-pressed', view === 'loans'); renderShelves(); renderLoans(); }
  $('#btnShelves').onclick = () => setView('shelves');
  $('#btnLoans').onclick = () => setView('loans');
  $('#btnRandom').onclick = () => { const items = filtered(); if (!items.length) return; const b = items[Math.floor(Math.random() * items.length)]; openPanel(b.id); };
  $('#shelves').addEventListener('click', (e) => { const b = e.target.closest('button[data-m]'); if (!b) return; const same = $('#mueble').value === b.dataset.m && $('#balda').value === b.dataset.b; $('#mueble').value = same ? '' : b.dataset.m; fillBaldas(); $('#balda').value = same ? '' : b.dataset.b; shownLimit = 200; renderList(); renderShelves(); if (!same) window.scrollTo({ top: $('#rows').offsetTop - 140, behavior: 'smooth' }); });
  $('#loansView').addEventListener('click', (e) => { const o = e.target.closest('[data-open]'); if (o) return openPanel(o.dataset.open); const r = e.target.closest('[data-return]'); if (r) { const l = loans.find(x => x._id === r.dataset.return); if (l) doReturn(l); } });
  $('#more').onclick = () => { shownLimit += 300; renderList(); };
  $('#rows').addEventListener('click', (e) => { const li = e.target.closest('.row'); if (li && li.dataset.id) openPanel(li.dataset.id); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && currentId) return closePanel();
    if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); $('#q').select(); }
  });

  // ---------- Arranque ----------
  fillSelects(); renderAll();
  const notice = $('#notice');
  (async () => {
    const use = (n) => (window.claude && typeof window.claude.use === 'function') ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
    const [db, user, downloads] = await Promise.all([use('db'), use('user'), use('downloads')]);
    store.downloads = downloads || null;
    if (db) {
      store.mode = 'db'; store.db = db; store.ready = true;
      const w = user ? await user.can('data.write').catch(() => null) : null;
      store.canWrite = w !== false;
      const onErr = (e) => { console.error(e); if (e && e.code !== 'unavailable') { notice.textContent = 'Se perdió la conexión con los datos guardados. Recarga la página.'; notice.hidden = false; } };
      db.collection('prestamos').onSnapshot(s => { loans = s.docs.map(d => Object.assign({ _id: d.id }, d.data())); renderAll(); }, onErr);
      db.collection('correcciones').onSnapshot(s => { fixes = {}; s.docs.forEach(d => { fixes[d.id] = d.data(); }); invalidate(); renderAll(); }, onErr);
      db.collection('extras').onSnapshot(s => { extras = s.docs.map((d, i) => Object.assign({ id: d.id, manual: true, conf: 'alta', video: '', seg: null, pos: 100000 + i }, d.data(), { notas: d.data().nota || '' })); invalidate(); fillSelects(); renderAll(); }, onErr);
      if (currentId) openPanel(currentId, true);
      return;
    }
    let ok = false; try { localStorage.setItem('biblioteca.test', '1'); localStorage.removeItem('biblioteca.test'); ok = true; } catch (e) { ok = false; }
    store.mode = ok ? 'local' : 'none'; store.canWrite = ok; store.ready = true;
    if (ok) fromLocal();
    else { notice.textContent = 'Este navegador no permite guardar datos, así que los préstamos y las correcciones no se conservarán.'; notice.hidden = false; renderAll(); }
  })();
})();
</script>
