<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#45291a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Biblioteca">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<style>:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Mi biblioteca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: un rótulo de madera con el nombre y las cifras, una barra de búsqueda pegajosa, y debajo o bien la lista de libros con sus portadas, o bien las estanterías dibujadas lomo a lomo, o bien los préstamos. La ficha de cada libro se abre en un panel lateral. */
:root {
  --bg: #ece3d2;
  --paper: #f8f3ea;
  --paper-2: #e6dcc8;
  --ink: #2a211a;
  --ink-2: #6d6052;
  --line: #d3c6ae;
  --wood: #5b3b24;
  --wood-2: #45291a;
  --wood-edge: #8a5a35;
  --wood-ink: #f3e7cf;
  --wood-ink-2: #c9ae86;
  --accent: #2f5d50;
  --accent-ink: #ffffff;
  --accent-soft: #d6e4de;
  --gold: #a9771f;
  --gold-soft: #f3e4c0;
  --bad: #9d3a3a;
  --bad-soft: #f0d9d5;
  --ok: #4a7a4f;
  --ok-soft: #d9e6d7;
  --display: "Cormorant Garamond", "Times New Roman", Georgia, serif;
  --body: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
  --shadow: 0 14px 40px rgba(50, 30, 10, .22);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1612; --paper: #261f19; --paper-2: #342a22; --ink: #efe5d4; --ink-2: #b3a391; --line: #4a3c30;
    --wood: #3a2415; --wood-2: #2a1a0f; --wood-edge: #6f4728; --wood-ink: #f3e7cf; --wood-ink-2: #b89a6e;
    --accent: #82b8a6; --accent-ink: #10201a; --accent-soft: #233b34; --gold: #d8a84a; --gold-soft: #3e3119;
    --bad: #df8484; --bad-soft: #3f2424; --ok: #8fc48f; --ok-soft: #24362a; --shadow: 0 14px 40px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1612; --paper: #261f19; --paper-2: #342a22; --ink: #efe5d4; --ink-2: #b3a391; --line: #4a3c30;
  --wood: #3a2415; --wood-2: #2a1a0f; --wood-edge: #6f4728; --wood-ink: #f3e7cf; --wood-ink-2: #b89a6e;
  --accent: #82b8a6; --accent-ink: #10201a; --accent-soft: #233b34; --gold: #d8a84a; --gold-soft: #3e3119;
  --bad: #df8484; --bad-soft: #3f2424; --ok: #8fc48f; --ok-soft: #24362a; --shadow: 0 14px 40px rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--wood-2); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.sr { position: absolute; left: -9999px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Rótulo */
.sign {
  background: linear-gradient(180deg, var(--wood) 0%, var(--wood-2) 100%); color: var(--wood-ink);
  border-bottom: 6px solid var(--wood-edge); box-shadow: inset 0 -1px 0 rgba(255,255,255,.08);
}
.sign .gutter { padding-block: 20px 16px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 28px; }
.brand h1 { font-family: var(--display); font-weight: 600; font-size: 42px; line-height: .95; margin: 0; letter-spacing: .01em; color: var(--wood-ink); }
.brand h1::after { content: ""; display: block; width: 72px; height: 2px; margin-top: 10px; background: var(--gold); box-shadow: 0 4px 0 var(--gold); }
.brand p { margin: 12px 0 0; color: var(--wood-ink-2); font-size: 13.5px; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { background: rgba(0,0,0,.22); border: 1px solid rgba(255,230,180,.22); border-radius: 6px; padding: 8px 14px; min-width: 100px; cursor: pointer; text-align: left; color: inherit; box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
.tile b { display: block; font-family: var(--display); font-size: 28px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; color: var(--wood-ink); }
.tile span { font-size: 11.5px; color: var(--wood-ink-2); text-transform: uppercase; letter-spacing: .08em; }
.tile.gold b { color: var(--gold); }
.tile[aria-pressed="true"] { border-color: var(--gold); background: rgba(0,0,0,.4); }
.sign-actions { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
.ghost { background: transparent; color: var(--wood-ink); border: 1px solid rgba(255,230,180,.3); border-radius: 6px; padding: 6px 12px; font-size: 14px; }
.ghost[aria-pressed="true"] { background: var(--wood-ink); color: var(--wood-2); border-color: var(--wood-ink); }
.menu { position: relative; }
.menu-list { position: absolute; top: calc(100% + 6px); left: 0; background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); min-width: 250px; padding: 6px; z-index: 15; display: flex; flex-direction: column; }
.menu-list button { background: transparent; border: 0; text-align: left; padding: 8px 10px; border-radius: 6px; }
.menu-list button:hover { background: var(--paper-2); }
.menu-list small { display: block; color: var(--ink-2); font-size: 12px; }

/* Barra */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); box-shadow: 0 6px 16px rgba(60,40,20,.08); }
.bar .gutter { padding-block: 10px 8px; }
.search-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { flex: 1 1 280px; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 2px 0; font-size: 16px; }
.search input:focus { outline: none; }
.search svg { width: 16px; height: 16px; flex: none; color: var(--ink-2); }
.search kbd { font-size: 11px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-family: var(--body); }
select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; max-width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 3px 11px; font-size: 13px; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip .n { font-variant-numeric: tabular-nums; opacity: .8; margin-left: 4px; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 7px 12px; font-weight: 500; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.small { padding: 4px 9px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }

main .gutter { padding-block: 14px 48px; }
.notice { background: var(--gold-soft); color: var(--ink); border-radius: 8px; padding: 8px 12px; margin: 0 0 12px; font-size: 13.5px; }

/* Estanterías dibujadas */
.cabinets { display: flex; flex-direction: column; gap: 18px; margin: 0 0 18px; }
.cabinet { background: var(--wood); border: 6px solid var(--wood-2); border-radius: 8px; padding: 10px 12px 0; box-shadow: var(--shadow); color: var(--wood-ink); }
.cabinet h3 { font-family: var(--display); font-weight: 600; font-size: 24px; margin: 0 0 4px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.cabinet h3 small { font-family: var(--body); font-size: 13px; color: var(--wood-ink-2); font-variant-numeric: tabular-nums; }
.balda { margin-bottom: 4px; }
.balda-name { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--wood-ink-2); padding: 6px 2px 2px; }
.balda-name button { background: transparent; border: 0; color: inherit; padding: 0; text-decoration: underline dotted; text-underline-offset: 3px; }
.balda-name button[aria-pressed="true"] { color: var(--gold); }
.spines { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 0 1px; padding: 0 4px; }
.slot { height: 74px; display: flex; align-items: flex-end; border-bottom: 9px solid var(--wood-edge); box-shadow: 0 1px 0 var(--wood-2); }
.spine { display: block; border: 0; padding: 0; width: 9px; border-radius: 1px 1px 0 0; position: relative; box-shadow: inset -1px 0 0 rgba(0,0,0,.25), inset 1px 0 0 rgba(255,255,255,.18); }
.spine:hover, .spine:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; z-index: 1; }
.spine.loan::after { content: ""; position: absolute; top: -6px; left: 50%; width: 6px; height: 10px; margin-left: -3px; background: var(--gold); }
.spine.ileg { background-image: repeating-linear-gradient(180deg, rgba(0,0,0,.18) 0 3px, transparent 3px 6px) !important; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); margin: 0 0 16px; }
.legend i { display: inline-block; width: 10px; height: 14px; vertical-align: -2px; margin-right: 5px; border-radius: 1px; }


/* Red de libros */
.net-tools { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; color: var(--ink-2); margin: 0 0 8px; }
.net-tools label { display: inline-flex; align-items: center; gap: 5px; }
.net-wrap { position: relative; border: 6px solid var(--wood-2); border-radius: 8px; background: var(--paper); box-shadow: var(--shadow); overflow: hidden; margin: 0 0 18px; }
.net-wrap canvas { display: block; width: 100%; height: min(72vh, 760px); cursor: grab; touch-action: none; }
.net-wrap canvas.drag { cursor: grabbing; }
.net-tip { position: absolute; pointer-events: none; background: var(--wood-2); color: var(--wood-ink); padding: 6px 9px; border-radius: 6px; font-size: 12.5px; max-width: 260px; box-shadow: var(--shadow); transform: translate(12px, 12px); }
.net-tip b { display: block; font-family: var(--display); font-size: 15px; font-weight: 600; line-height: 1.15; }
.net-zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
.net-zoom button { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--line); background: var(--paper); font-size: 16px; }

/* Préstamos */
.loans { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.loan { background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 8px; padding: 10px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.loan .t { font-family: var(--display); font-size: 20px; font-weight: 600; }
.loan .d { color: var(--ink-2); font-size: 13.5px; }
.loan .act { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 6px; }

/* Lista */
.list-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--ink-2); font-size: 13.5px; margin: 2px 0 8px; flex-wrap: wrap; }
.rows { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 8px; }
.row { display: grid; grid-template-columns: 44px 1fr; gap: 2px 12px; padding: 8px 10px 8px 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; align-items: center; min-width: 0; }
.row:hover { border-color: var(--gold); }
.row[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.cover { grid-row: 1 / span 3; width: 44px; height: 66px; border-radius: 2px; background-color: var(--paper-2); background-repeat: no-repeat; box-shadow: 1px 1px 3px rgba(0,0,0,.25); position: relative; overflow: hidden; }
.cover.ph { display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; font-size: 16px; color: rgba(255,255,255,.85); text-shadow: 0 1px 1px rgba(0,0,0,.3); }
.cover.ph::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: rgba(0,0,0,.2); }
.row .t { font-family: var(--display); font-weight: 600; font-size: 19px; line-height: 1.15; min-width: 0; }
.row .t em { font-style: normal; background: var(--gold-soft); border-radius: 3px; padding: 0 2px; }
.row .t .tomo { color: var(--ink-2); font-size: 13.5px; font-family: var(--body); font-weight: 400; }
.row .a { color: var(--ink-2); font-size: 13.5px; min-width: 0; line-height: 1.3; }
.row .meta { display: flex; flex-wrap: wrap; gap: 4px; font-size: 12px; color: var(--ink-2); align-items: center; }
.tag { display: inline-block; border-radius: 3px; padding: 1px 6px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.tag.cat { background: var(--paper-2); color: var(--ink-2); }
.tag.loan { background: var(--gold-soft); color: var(--gold); }
.tag.rev { background: var(--bad-soft); color: var(--bad); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.new { background: var(--accent-soft); color: var(--accent); }
.tag.dup { background: var(--paper-2); color: var(--ink-2); border: 1px dashed var(--ink-2); }
.more { display: block; width: 100%; margin-top: 12px; padding: 10px; border: 1px dashed var(--line); background: transparent; border-radius: 8px; color: var(--ink-2); }
.empty { padding: 30px 10px; text-align: center; color: var(--ink-2); grid-column: 1 / -1; }

/* Ficha */
.backdrop { position: fixed; inset: 0; background: rgba(30,18,8,.45); z-index: 20; }
aside.panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(500px, 100%); background: var(--paper); z-index: 21; box-shadow: var(--shadow);
  overflow-y: auto; padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px;
}
.panel-head { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: start; }
.panel h2 { font-family: var(--display); font-weight: 600; font-size: 27px; line-height: 1.1; margin: 0; text-wrap: balance; }
.panel .sub { color: var(--ink-2); margin-top: 4px; font-size: 15px; }
.close { border: 0; background: var(--paper-2); border-radius: 50%; width: 32px; height: 32px; flex: none; font-size: 18px; line-height: 1; }
.bigcover { width: 132px; height: 198px; border-radius: 3px; box-shadow: 2px 3px 10px rgba(0,0,0,.35); background: var(--paper-2); overflow: hidden; position: relative; }
.bigcover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; z-index: 1; }
.bigcover .cover { width: 100%; height: 100%; border-radius: 0; box-shadow: none; }
.bigcover .cover.sp { background-size: var(--sprite-w-big) auto; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 5px 10px; font-size: 13.5px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--paper); }
.card h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); font-weight: 600; }
.card.loaned { border-color: var(--gold); background: var(--gold-soft); }
.field { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--ink-2); }
.field input, .field select, .field textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; color: var(--ink); width: 100%; }
.field textarea { min-height: 54px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.hist { list-style: none; margin: 0; padding: 0; font-size: 13px; color: var(--ink-2); display: flex; flex-direction: column; gap: 3px; }
.hint { font-size: 12.5px; color: var(--ink-2); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--wood-2); color: var(--wood-ink); padding: 8px 14px; border-radius: 8px; font-size: 13.5px; z-index: 30; max-width: 90vw; box-shadow: var(--shadow); }
details.add { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 0 0 12px; background: var(--paper); }
details.add summary { cursor: pointer; font-weight: 500; }
details.add .grid2 { margin-top: 8px; }
.dup-list { font-size: 13px; color: var(--ink-2); }
@media (max-width: 640px) {
  .kv { grid-template-columns: 1fr; gap: 2px; }
  .kv dt { margin-top: 6px; }
  .grid2 { grid-template-columns: 1fr; }
  .brand h1 { font-size: 34px; }
  .tile { min-width: 0; flex: 1 1 28%; padding: 6px 9px; }
  .tile b { font-size: 22px; }
  .loan .act { grid-column: 1; grid-row: auto; }
  .rows { grid-template-columns: 1fr; }
  .bigcover { width: 96px; height: 144px; }
}
@media (prefers-reduced-motion: no-preference) {
  aside.panel { animation: slide .18s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
}
</style>

<header class="sign">
  <div class="gutter">
    <div class="brand">
      <h1>Mi biblioteca</h1>
      <p id="subtitle">Catálogo leído de los vídeos de las estanterías.</p>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="sign-actions">
      <button class="ghost" id="btnShelves" aria-pressed="false">Ver las estanterías</button>
      <button class="ghost" id="btnLoans" aria-pressed="false">Préstamos</button>
      <button class="ghost" id="btnNet" aria-pressed="false">Red de libros</button>
      <button class="ghost" id="btnRandom">Al azar</button>
      <div class="menu">
        <button class="ghost" id="btnExport" aria-haspopup="true" aria-expanded="false">Exportar e importar</button>
        <div class="menu-list" id="exportMenu" hidden>
          <button id="exCsv">Descargar CSV de la lista actual<small>Lo que está filtrado ahora, con tus correcciones</small></button>
          <button id="exAll">Descargar CSV del catálogo completo<small>Todos los libros con estantería, balda y estado</small></button>
          <button id="exJson">Copia de seguridad de tus datos<small>Préstamos, correcciones y libros añadidos, en JSON</small></button>
          <button id="imJson">Restaurar una copia de seguridad<small>Lee un JSON exportado desde aquí</small></button>
          <input type="file" id="imFile" accept="application/json" class="sr">
        </div>
      </div>
    </div>
  </div>
</header>

<div class="bar">
  <div class="gutter">
    <div class="search-row">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="sr">Buscar</span>
        <input id="q" type="search" placeholder="Buscar por título, autor, colección o editorial" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <select id="mueble" aria-label="Estantería"><option value="">Todas las estanterías</option></select>
      <select id="balda" aria-label="Balda"><option value="">Todas las baldas</option></select>
      <select id="cat" aria-label="Categoría"><option value="">Todas las categorías</option></select>
      <select id="orden" aria-label="Orden">
        <option value="pos">Orden en la estantería</option>
        <option value="titulo">Por título</option>
        <option value="autor">Por autor</option>
      </select>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Estado"></div>
  </div>
</div>

<main>
  <div class="gutter">
    <div id="notice" class="notice" hidden></div>
    <section id="shelves" hidden></section>
    <section id="loansView" hidden></section>
    <section id="netView" hidden>
      <div class="net-tools">
        <span>Cada punto es un libro, agrupado por categoría. Las líneas unen libros del mismo autor o de la misma colección. Rueda para ampliar, arrastra para moverte, pulsa un punto para abrir su ficha.</span>

      if (b) { tip.hidden = false; tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.innerHTML = `<b>${esc(b.titulo)}${b.tomo ? ' ' + esc(String(b.tomo)) : ''}</b>${esc(b.autor || '')}${b.col ? ' · ' + esc(b.col) : ''}<br><span style="opacity:.8">${esc(b.cat)} · ${esc(shelfName(b.mueble))}, balda ${esc(b.balda.split(' ')[0])}</span>`; }
      else tip.hidden = true;
    });
    cv.addEventListener('pointerup', (e) => {
      cv.classList.remove('drag'); const was = dragging; dragging = false;
      if (was && !moved) { const r = cv.getBoundingClientRect(); const b = bookAt(nearest(e.clientX - r.left, e.clientY - r.top)); if (b) openPanel(b.id); }
    });
    cv.addEventListener('pointerleave', () => { tip.hidden = true; if (hover !== -1) { hover = -1; draw(); } });
    // pellizco con dos dedos
    cv.addEventListener('touchstart', (e) => { if (e.touches.length === 2) { pinch = { d: Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY) }; dragging = false; } }, { passive: true });
    cv.addEventListener('touchmove', (e) => { if (e.touches.length === 2 && pinch) { e.preventDefault(); const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); const r = cv.getBoundingClientRect(); zoomAt(d / pinch.d, (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left, (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top); pinch.d = d; } }, { passive: false });
    cv.addEventListener('touchend', () => { pinch = null; });
    $('#netIn').onclick = () => { const r = cv.getBoundingClientRect(); zoomAt(1.4, r.width / 2, r.height / 2); };
    $('#netOut').onclick = () => { const r = cv.getBoundingClientRect(); zoomAt(1 / 1.4, r.width / 2, r.height / 2); };
    $('#netFit').onclick = fit;
    ['#netAutor', '#netCol', '#netLabels'].forEach(s => $(s).addEventListener('change', draw));
    window.addEventListener('resize', () => { if (!$('#netView').hidden) fit(); });
    function focusOn(id) {
      const b = allBooks().find(x => x.id === id); if (!b) return;
      requestAnimationFrame(() => { if (!size()) return; const r = cv.getBoundingClientRect(); const p = nodePos(b); scale = 3; tx = r.width / 2 - p[0] * scale; ty = r.height / 2 - p[1] * scale; sized = true; draw(); window.scrollTo({ top: $('#netView').offsetTop - 120, behavior: 'smooth' }); });
    }
    return { draw, fit, focusOn, reset() { sized = false; } };
  })();
  function renderNet() { const sec = $('#netView'); sec.hidden = view !== 'network'; if (!sec.hidden) requestAnimationFrame(() => net.draw()); }

  // ---------- Ficha ----------
  function openPanel(id, keep) {
    const b = allBooks().find(x => x.id === id);
    if (!b) return closePanel();
    currentId = id;
    const loan = activeLoan(id);
    const hist = loans.filter(l => l.libro === id && l.devuelto).sort((a, b) => (b.desde || '').localeCompare(a.desde || ''));
    const seg = b.seg != null && b.seg !== '' ? `${b.video}, segundo ${Math.round(b.seg)}` : (b.video || 'añadido a mano');
    const dis = store.canWrite ? '' : 'disabled';
    const dups = isDup(b) ? allBooks().filter(x => x.id !== b.id && dupKey(x) === dupKey(b)) : [];
    $('#panelHost').innerHTML = `
      <div class="backdrop" id="backdrop"></div>
      <aside class="panel" role="dialog" aria-labelledby="pt">
        <div class="panel-head">
          <div><h2 id="pt">${esc(b.titulo)}${b.tomo ? ' <span style="font-weight:500;color:var(--ink-2);font-size:19px">' + esc(String(b.tomo)) + '</span>' : ''}</h2>
            <div class="sub">${esc(b.autor || 'Autor no leído')}</div></div>
          <button class="close" id="closeBtn" aria-label="Cerrar">×</button>
          ${bigCoverHtml(b)}
        </div>
        <dl class="kv">
          <dt>Colección</dt><dd>${esc(b.col || '')}</dd>
          <dt>Editorial</dt><dd>${esc(b.ed || '')}</dd>
          <dt>Categoría</dt><dd>${esc(b.cat)}</dd>
          <dt>Dónde está</dt><dd>${esc(shelfName(b.mueble))}, balda ${esc(b.balda)}</dd>
          <dt>Lectura</dt><dd>Confianza ${esc(b.conf || 'alta')} (${esc(seg)})${b.revisado ? ' · revisado a mano' : ''}</dd>
          ${b.notas ? `<dt>Notas</dt><dd>${esc(b.notas)}</dd>` : ''}
          ${dups.length ? `<dt>Repetido</dt><dd class="dup-list">Parece el mismo libro que ${dups.map(d => esc(shelfName(d.mueble)) + ', balda ' + esc(d.balda.split(' ')[0])).join('; ')}. Pueden ser ediciones distintas.</dd>` : ''}
        </dl>
        <section class="card ${loan ? 'loaned' : ''}">
          <h3>Préstamo</h3>
          ${loan ? `
            <div>Prestado a <b>${esc(loan.a || 'alguien')}</b> desde el ${fmtDate(loan.desde)} (${daysSince(loan.desde) === 0 ? 'hoy' : daysSince(loan.desde) === 1 ? 'hace 1 día' : 'hace ' + daysSince(loan.desde) + ' días'})${loan.nota ? ' · ' + esc(loan.nota) : ''}</div>
            <div class="actions"><button class="btn primary" id="returnBtn" ${dis}>Marcar como devuelto</button></div>
          ` : `
            <div class="grid2">
              <label class="field">A quién <input id="loanTo" placeholder="Nombre" list="people" ${dis}></label>
              <label class="field">Desde <input id="loanDate" type="date" value="${today()}" ${dis}></label>
            </div>
            <datalist id="people">${[...new Set(loans.map(l => l.a).filter(Boolean))].map(p => `<option value="${esc(p)}">`).join('')}</datalist>
            <label class="field">Nota <input id="loanNote" placeholder="Opcional" ${dis}></label>
            <div class="actions"><button class="btn primary" id="loanBtn" ${dis}>Apuntar préstamo</button></div>
          `}
          ${hist.length ? `<ul class="hist">${hist.map(h => `<li>Prestado a ${esc(h.a || 'alguien')}, del ${fmtDate(h.desde)} al ${fmtDate(h.devueltoEl)}</li>`).join('')}</ul>` : ''}
        </section>
        <section class="card">
          <h3>Corregir la ficha</h3>
          <div class="grid2">
            <label class="field">Título <input id="f_titulo" value="${esc(b.titulo)}" ${dis}></label>
            <label class="field">Autor <input id="f_autor" value="${esc(b.autor)}" ${dis}></label>
            <label class="field">Colección <input id="f_col" value="${esc(b.col)}" ${dis}></label>
            <label class="field">Tomo <input id="f_tomo" value="${esc(String(b.tomo))}" ${dis}></label>
            <label class="field">Editorial <input id="f_ed" value="${esc(b.ed)}" ${dis}></label>
            <label class="field">Categoría <select id="f_cat" ${dis}>${CATS.map(c => `<option ${c === b.cat ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
          </div>
          <label class="field">Nota tuya <textarea id="f_nota" ${dis}>${esc(b.manual ? b.notas : (fixes[b.id] || {}).nota || '')}</textarea></label>
          <div class="actions">
            <button class="btn primary" id="saveFix" ${dis}>Guardar cambios</button>
            <button class="btn" id="revBtn" ${dis}>${b.revisado ? 'Quitar la marca de revisado' : 'Marcar como revisado'}</button>
            ${!b.manual ? `<button class="btn" id="coverBtn" ${dis}>Buscar portada</button>` : ''}
            <button class="btn" id="netBtn">Ver en la red</button>
            ${b.manual ? `<button class="btn danger" id="delBtn" ${dis}>Eliminar este libro</button>` : ''}
          </div>
          <div class="hint">${storeHint()}</div>
        </section>
      </aside>`;
    $('#backdrop').onclick = closePanel;
    $('#closeBtn').onclick = closePanel;
    if (!keep) $('#closeBtn').focus();
    const g = (s) => document.getElementById(s);
    if (g('loanBtn')) g('loanBtn').onclick = () => doLoan(b);
    if (g('returnBtn')) g('returnBtn').onclick = () => doReturn(loan);
    g('saveFix').onclick = () => saveFix(b);
    g('revBtn').onclick = () => toggleReview(b);
    if (g('coverBtn')) g('coverBtn').onclick = () => findCover(b);
    g('netBtn').onclick = () => { closePanel(); setView('network'); net.focusOn(b.id); };
    if (g('delBtn')) g('delBtn').onclick = () => delManual(b);
    document.querySelectorAll('.row').forEach(r => r.setAttribute('aria-current', r.dataset.id === id));
  }
  function storeHint() {
    if (!store.ready) return 'Conectando con el almacén de datos…';
    if (store.mode === 'db') return store.canWrite ? 'Los cambios se guardan en esta página y se ven desde cualquier dispositivo.' : 'Solo lectura: no tienes permiso para guardar cambios.';
    if (store.mode === 'local') return 'Los cambios se guardan en este navegador. Haz una copia de seguridad desde “Exportar e importar” para no perderlos.';
    return 'No hay dónde guardar: este navegador no permite almacenar datos.';
  }
  function closePanel() { currentId = null; $('#panelHost').innerHTML = ''; document.querySelectorAll('.row[aria-current="true"]').forEach(r => r.setAttribute('aria-current', 'false')); }

  // ---------- Escrituras ----------
  async function doLoan(b) {
    const a = $('#loanTo').value.trim(); if (!a) { $('#loanTo').focus(); return toast('Escribe a quién se lo prestas.'); }
    try { await api.addLoan({ libro: b.id, titulo: b.titulo, autor: b.autor, a, desde: $('#loanDate').value || today(), nota: $('#loanNote').value.trim(), devuelto: false, creado: new Date().toISOString() }); toast(`Apuntado: prestado a ${a}.`); } catch (e) { fail(e); }
  }
  async function doReturn(loan) { try { await api.updateLoan(loan._id, { devuelto: true, devueltoEl: today() }); toast('Marcado como devuelto.'); } catch (e) { fail(e); } }
  function baseValue(id, k) { const o = base.find(x => x.id === id); return o ? o[k] : ''; }
  async function saveFix(b) {
    const v = (el) => document.getElementById(el).value.trim();
    const nota = v('f_nota');
    if (b.manual) { try { await api.updateExtra(b.id, { titulo: v('f_titulo'), autor: v('f_autor'), col: v('f_col'), tomo: v('f_tomo'), ed: v('f_ed'), cat: $('#f_cat').value, nota }); toast('Guardado.'); } catch (e) { fail(e); } return; }
    const campos = {};
    [['titulo', 'f_titulo'], ['autor', 'f_autor'], ['col', 'f_col'], ['tomo', 'f_tomo'], ['ed', 'f_ed'], ['cat', 'f_cat']].forEach(([k, el]) => { const val = v(el); if (val !== (baseValue(b.id, k) || '').toString()) campos[k] = val; });
    const prev = fixes[b.id] || {};
    try {
      if (!Object.keys(campos).length && !nota && !prev.revisado && !prev.portada) { if (prev.actualizado) await api.delFix(b.id); toast('Sin cambios respecto al catálogo.'); return; }
      await api.setFix(b.id, Object.assign({}, prev, { campos, nota, revisado: !!prev.revisado, actualizado: new Date().toISOString() })); toast('Corrección guardada.');
    } catch (e) { fail(e); }
  }
  async function toggleReview(b) {
    const prev = fixes[b.id] || { campos: {}, nota: '' };
    try { await api.setFix(b.id, Object.assign({}, prev, { revisado: !b.revisado, actualizado: new Date().toISOString() })); toast(b.revisado ? 'Marca quitada.' : 'Marcado como revisado.'); } catch (e) { fail(e); }
  }
  async function findCover(b) {
    const t = b.titulo.replace(/\(.*?\)/g, ' ').split(/\s[·|/]\s|:\s/)[0].trim();
    const a = (b.autor || '').split(/,| y | e |\//)[0].trim().split(' ').pop() || '';
    toast('Buscando en Open Library…');
    try {
      const r = await fetch('https://openlibrary.org/search.json?' + new URLSearchParams({ title: t, author: a, limit: '5', fields: 'cover_i,language' }));
      const docs = ((await r.json()).docs || []).filter(d => d.cover_i);
      if (!docs.length) return toast('No hay portada en Open Library para este libro.');
      const es = docs.find(d => (d.language || []).includes('spa')) || docs[0];
      const prev = fixes[b.id] || { campos: {}, nota: '' };
      await api.setFix(b.id, Object.assign({}, prev, { portada: es.cover_i, actualizado: new Date().toISOString() }));
      toast('Portada encontrada.');
    } catch (e) { console.error(e); toast('Desde aquí no se puede consultar Open Library. Prueba en la copia publicada en GitHub.'); }
  }
  async function delManual(b) { try { await api.delExtra(b.id); closePanel(); toast('Libro eliminado.'); } catch (e) { fail(e); } }
  $('#addForm').onsubmit = async (ev) => {
    ev.preventDefault();
    if (!store.canWrite) return toast('No hay dónde guardar en esta copia de la página.');
    const v = (s) => $(s).value.trim();
    try { await api.addExtra({ titulo: v('#n_titulo'), autor: v('#n_autor'), col: v('#n_col'), tomo: v('#n_tomo'), ed: v('#n_ed'), cat: $('#n_cat').value, mueble: v('#n_mueble') || 'Sin estantería', balda: v('#n_balda') || 'sin balda', nota: '', creado: new Date().toISOString() }); $('#addForm').reset(); $('#addBox').open = false; toast('Libro añadido.'); } catch (e) { fail(e); }
  };

  // ---------- Exportar e importar ----------
  function csvOf(books) {
    const cols = ['id', 'titulo', 'autor', 'coleccion', 'tomo', 'editorial', 'categoria', 'confianza', 'estanteria', 'balda', 'prestado_a', 'prestado_desde', 'revisado', 'nota', 'portada_openlibrary', 'video', 'segundo', 'notas_lectura'];
    const cell = (s) => { s = (s == null ? '' : s).toString(); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const lines = [cols.join(',')];
    books.forEach(b => { const l = activeLoan(b.id); lines.push([b.id, b.titulo, b.autor, b.col, b.tomo, b.ed, b.cat, b.conf, b.mueble, b.balda, l ? l.a : '', l ? l.desde : '', b.revisado ? 'sí' : '', b.notaUsuario || (b.manual ? b.notas : ''), b.olid || '', b.video, b.seg == null ? '' : b.seg, b.manual ? '' : b.notas].map(cell).join(',')); });
    return '﻿' + lines.join('\r\n');
  }
  async function download(filename, text, type) {
    const blob = new Blob([text], { type });
    if (store.downloads) { try { await store.downloads.save({ filename, data: blob }); return; } catch (e) { if (e && e.code === 'cancelled') return; console.error(e); } }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function backupJson() {
    return JSON.stringify({ formato: 'biblioteca-backup-1', fecha: new Date().toISOString(), prestamos: loans.map(l => { const { _id, ...r } = l; return Object.assign({ id: _id }, r); }), correcciones: fixes, extras: extras.map(x => ({ id: x.id, titulo: x.titulo, autor: x.autor, col: x.col, tomo: x.tomo, ed: x.ed, cat: x.cat, mueble: x.mueble, balda: x.balda, nota: x.notas, creado: x.creado })) }, null, 1);
  }
  async function importJson(file) {
    let d; try { d = JSON.parse(await file.text()); } catch (e) { return toast('Ese archivo no es una copia de seguridad válida.'); }
    if (!d || d.formato !== 'biblioteca-backup-1') return toast('Ese archivo no es una copia de seguridad válida.');
    if (!store.canWrite) return toast('No hay dónde guardar en esta copia de la página.');
    let n = 0;
    try {
      if (store.mode === 'db') {
        for (const l of d.prestamos || []) { const { id, ...r } = l; await store.db.doc('prestamos/' + (id || uid())).set(r); n++; }
        for (const [id, f] of Object.entries(d.correcciones || {})) { await store.db.doc('correcciones/' + id).set(f); n++; }
        for (const x of d.extras || []) { const { id, ...r } = x; await store.db.doc('extras/' + (id || uid())).set(r); n++; }
      } else {
        localWrite(s => {
          (d.prestamos || []).forEach(l => { const { id, ...r } = l; s.prestamos[id || uid()] = r; n++; });
          Object.entries(d.correcciones || {}).forEach(([id, f]) => { s.correcciones[id] = f; n++; });
          (d.extras || []).forEach(x => { const { id, ...r } = x; s.extras[id || uid()] = r; n++; });
        });
      }
      toast(`Restaurados ${n} registros.`);
    } catch (e) { fail(e); }
  }
  $('#btnExport').onclick = (e) => { e.stopPropagation(); const m = $('#exportMenu'); m.hidden = !m.hidden; $('#btnExport').setAttribute('aria-expanded', !m.hidden); };
  document.addEventListener('click', (e) => { if (!e.target.closest('.menu')) { $('#exportMenu').hidden = true; $('#btnExport').setAttribute('aria-expanded', 'false'); } });
  $('#exCsv').onclick = () => download('biblioteca_filtrada.csv', csvOf(filtered()), 'text/csv;charset=utf-8');
  $('#exAll').onclick = () => download('biblioteca_completa.csv', csvOf(allBooks()), 'text/csv;charset=utf-8');
  $('#exJson').onclick = () => download('biblioteca_copia_' + today() + '.json', backupJson(), 'application/json');
  $('#imJson').onclick = () => $('#imFile').click();
  $('#imFile').onchange = () => { if ($('#imFile').files[0]) importJson($('#imFile').files[0]); $('#imFile').value = ''; };

  // ---------- Eventos ----------
  ['#q', '#cat', '#orden', '#balda'].forEach(s => $(s).addEventListener('input', () => { shownLimit = 120; renderList(); renderShelves(); net.draw(); }));
  $('#mueble').addEventListener('input', () => { fillBaldas(); shownLimit = 120; renderList(); renderShelves(); net.draw(); });
  $('#chips').addEventListener('click', (e) => { const btn = e.target.closest('.chip'); if (!btn) return; setFilter(btn.dataset.f); });
  $('#tiles').addEventListener('click', (e) => { const t = e.target.closest('.tile'); if (!t) return; setFilter(t.dataset.go); if (t.dataset.go === 'prestados') setView('loans'); });
  function setFilter(f) { filter = f; shownLimit = 120; renderTiles(); renderChips(); renderList(); net.draw(); }
  function setView(v) { view = view === v ? 'list' : v; $('#btnShelves').setAttribute('aria-pressed', view === 'shelves'); $('#btnLoans').setAttribute('aria-pressed', view === 'loans'); $('#btnNet').setAttribute('aria-pressed', view === 'network'); renderShelves(); renderLoans(); renderNet(); }
  $('#btnShelves').onclick = () => setView('shelves');
  $('#btnLoans').onclick = () => setView('loans');
  $('#btnNet').onclick = () => setView('network');
  $('#btnRandom').onclick = () => { const items = filtered(); if (!items.length) return; const b = items[Math.floor(Math.random() * items.length)]; openPanel(b.id); };
  $('#shelves').addEventListener('click', (e) => {
    const sp = e.target.closest('.spine'); if (sp) return openPanel(sp.dataset.id);
    const b = e.target.closest('button[data-m]'); if (!b) return;
    const same = $('#mueble').value === b.dataset.m && $('#balda').value === b.dataset.b;
    $('#mueble').value = same ? '' : b.dataset.m; fillBaldas(); $('#balda').value = same ? '' : b.dataset.b; shownLimit = 120; renderList(); renderShelves();
    if (!same) window.scrollTo({ top: $('#rows').offsetTop - 150, behavior: 'smooth' });
  });
  $('#loansView').addEventListener('click', (e) => { const o = e.target.closest('[data-open]'); if (o) return openPanel(o.dataset.open); const r = e.target.closest('[data-return]'); if (r) { const l = loans.find(x => x._id === r.dataset.return); if (l) doReturn(l); } });
  $('#more').onclick = () => { shownLimit += 240; renderList(); };
  $('#rows').addEventListener('click', (e) => { const li = e.target.closest('.row'); if (li && li.dataset.id) openPanel(li.dataset.id); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && currentId) return closePanel();
    if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); $('#q').select(); }
  });

  // ---------- Arranque ----------
  fillSelects(); renderAll();
  const notice = $('#notice');
  (async () => {
    const use = (n) => (window.claude && typeof window.claude.use === 'function') ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
    const [db, user, downloads] = await Promise.all([use('db'), use('user'), use('downloads')]);
    store.downloads = downloads || null;
    if (db) {
      store.mode = 'db'; store.db = db; store.ready = true;
      const w = user ? await user.can('data.write').catch(() => null) : null;
      store.canWrite = w !== false;
      const onErr = (e) => { console.error(e); if (e && e.code !== 'unavailable') { notice.textContent = 'Se perdió la conexión con los datos guardados. Recarga la página.'; notice.hidden = false; } };
      db.collection('prestamos').onSnapshot(s => { loans = s.docs.map(d => Object.assign({ _id: d.id }, d.data())); renderAll(); }, onErr);
      db.collection('correcciones').onSnapshot(s => { fixes = {}; s.docs.forEach(d => { fixes[d.id] = d.data(); }); invalidate(); renderAll(); }, onErr);
      db.collection('extras').onSnapshot(s => { extras = s.docs.map((d, i) => Object.assign({ id: d.id, manual: true, conf: 'alta', video: '', seg: null, sp: -1, olid: null, pos: 100000 + i }, d.data(), { notas: d.data().nota || '' })); invalidate(); fillSelects(); renderAll(); }, onErr);
      if (currentId) openPanel(currentId, true);
      return;
    }
    let ok = false; try { localStorage.setItem('biblioteca.test', '1'); localStorage.removeItem('biblioteca.test'); ok = true; } catch (e) { ok = false; }
    store.mode = ok ? 'local' : 'none'; store.canWrite = ok; store.ready = true;
    if (ok) fromLocal();
    else { notice.textContent = 'Este navegador no permite guardar datos, así que los préstamos y las correcciones no se conservarán.'; notice.hidden = false; renderAll(); }
  })();
})();
</script>
